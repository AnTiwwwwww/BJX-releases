name: Build and release Windows beta

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '验证成功后发布当前 interface.json 版本'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'AnTiwwwwww/BJX-releases'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/mxu-runtime/src-tauri/target
          key: mxu-windows-2.8.0-${{ hashFiles('integrations/mxu/github-update.patch') }}
          restore-keys: mxu-windows-2.8.0-
      - name: Build verified BJX updater runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@10.28.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          ./tools/build-mxu.ps1
      - name: Validate version and build packages
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content interface.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-(?:beta|rc)\.\d+)?$') { throw '版本格式不支持' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne ('v' + $version)) { throw '标签与 interface.json 版本不一致' }
          if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) { throw '缺少本版更新说明' }
          ./tools/download-dependencies.ps1
          ./tools/test-source-package.ps1
          ./tools/test-update-gate.ps1
          $package = ./tools/export-beta.ps1
          ./tools/test-release-package.ps1 -PackagePath $package.Path
          ./tools/export-source.ps1 -OutputFile (Join-Path $PWD "export/BJX-source-v$version.zip")
          $runtimeVersion = (Get-Content integrations/mxu/build.json -Raw | ConvertFrom-Json).runtime_version
          Copy-Item -LiteralPath "build/mxu-patched/MXU-source-v$runtimeVersion.zip" -Destination export
          Copy-Item -LiteralPath "build/mxu-patched/MXU-source-v$runtimeVersion.zip.sha256" -Destination export
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BJX-v${{ steps.package.outputs.version }}
          path: |
            export/*.zip
            export/*.sha256
            export/release-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $tag = 'v' + $version
          $assets = @(Get-ChildItem -LiteralPath export -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name.EndsWith('.sha256') } | ForEach-Object FullName)
          $createArgs = @('release', 'create', $tag, '--draft', '--target', $env:GITHUB_SHA, '--title', "BJX $version", '--notes-file', "docs/releases/v$version.md") + $assets
          if ($version -match '-') { $createArgs += '--prerelease' }
          gh @createArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release 创建失败；不会覆盖已有发布' }
          $publishArgs = @('release', 'edit', $tag, '--draft=false')
          if ($version -match '-') { $publishArgs += @('--prerelease', '--latest=false') }
          gh @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败，草稿保留' }
